name: bilans
description: "Bilans — payroll, loans, official exchange rates and invoices for the Balkans. Offline-first, no account."
publish_to: 'none'

# versionName+versionCode. versionCode must increase with every Play upload.
version: 2.0.0+20

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  barcode: ^2.2.9
  file_selector: ^1.1.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  in_app_purchase_platform_interface: ^1.4.0
  in_app_review: ^2.0.12
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/legal/

  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: SourceSerif
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          weight: 400
          style: italic

# Launcher icon: regenerate with `dart run flutter_launcher_icons` after
# changing anything under tool/brand/.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "tool/brand/out/icon_full_1024.png"
  adaptive_icon_background: "#0E5A43"
  adaptive_icon_foreground: "tool/brand/out/icon_foreground_1024.png"
  adaptive_icon_monochrome: "tool/brand/out/icon_monochrome_1024.png"
  min_sdk_android: 24

# Native splash: regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#F3F0E8"
  color_dark: "#0E1311"
  image: "tool/brand/out/splash_mark_light.png"
  image_dark: "tool/brand/out/splash_mark_dark.png"
  android_12:
    color: "#F3F0E8"
    color_dark: "#0E1311"
    image: "tool/brand/out/splash_icon_light.png"
    image_dark: "tool/brand/out/splash_icon_dark.png"
  android: true
  ios: false
  web: false
