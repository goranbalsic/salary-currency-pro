name: Release

# Builds Bilans and publishes a GitHub release with the Android files.
# Runs when a version tag is pushed (git tag v2.0.0 && git push origin v2.0.0)
# or by hand from the Actions tab.
#
# Signing: add these repository secrets to sign with your upload key
# (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks file (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the builds are signed with a debug key: fine for testing and
# sideloading, but Google Play will not accept them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v2.0.1 (created on the selected branch if new)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test -j 1

      - name: Signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: builds are signed with the debug key (testing only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          name=${version%%+*}
          code=${version##*+}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          out=build/app/outputs/flutter-apk
          mkdir -p dist

          flutter build apk --release --flavor prod --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-prod-release.apk" "dist/Bilans-$name-$abi.apk"
          done
          flutter build apk --release --flavor prod
          cp "$out/app-prod-release.apk" "dist/Bilans-$name-universal.apk"

          flutter build apk --release --flavor dev -t lib/main_dev.dart --split-per-abi
          cp "$out/app-arm64-v8a-dev-release.apk" "dist/Bilans-DEV-$name-arm64-v8a.apk"

          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            flutter build appbundle --release --flavor prod
            cp build/app/outputs/bundle/prodRelease/app-prod-release.aab "dist/Bilans-$name.aab"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - name: Release notes
        env:
          NAME: ${{ steps.build.outputs.name }}
          CODE: ${{ steps.build.outputs.code }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          {
            echo "Bilans $NAME (build $CODE)"
            echo
            echo "| File | For |"
            echo "|---|---|"
            echo "| Bilans-$NAME-arm64-v8a.apk | Most phones (64-bit ARM) |"
            echo "| Bilans-$NAME-armeabi-v7a.apk | Older 32-bit phones |"
            echo "| Bilans-$NAME-x86_64.apk | Emulators and Chromebooks |"
            echo "| Bilans-$NAME-universal.apk | Any device (larger download) |"
            echo "| Bilans-DEV-$NAME-arm64-v8a.apk | Test build: installs next to the real app, with a Pro simulator in Settings |"
            if [ "$SIGNED" = "true" ]; then
              echo "| Bilans-$NAME.aab | Upload to Google Play |"
            fi
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with the upload key."
            else
              echo "Signed with a debug key: for testing and sideloading only. Google Play needs a build signed with the upload key (see docs/launch/PLAY_CONSOLE.md)."
              echo "Each test release gets a new temporary key, so uninstall the previous test build before installing this one."
            fi
            echo
            echo "Install: download the APK on the phone, open it and allow installing from this source. Checksums: SHA256SUMS.txt."
          } > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Bilans ${{ steps.build.outputs.name }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          fail_on_unmatched_files: true
